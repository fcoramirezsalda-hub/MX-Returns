<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<title>Retornos BringGo</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--txt:#1c1f24;--sub:#5d6573;--line:#d9dde3;--pri:#1f5fbf;--ok:#1e8e3e;--okbg:#e6f4ea;--warn:#b26a00;--warnbg:#fff4e0;--err:#c5221f;--errbg:#fce8e6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header b{font-size:17px}
#op{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:16px;padding:6px 12px;font-size:15px}
main{padding:10px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button,.racks button,.tipo button{border:2px solid var(--line);background:#fff;border-radius:8px;padding:12px 4px;font-size:15px;font-weight:bold;color:var(--txt)}
.seg button.on,.racks button.on,.tipo button.on{border-color:var(--pri);background:#e8f0fe;color:var(--pri)}
.seg button.sug{border-style:dashed;border-color:var(--warn)}
.tipo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.racks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.racks button{padding:8px 2px;line-height:1.2}
.racks small{display:block;font-weight:normal;font-size:11px;color:var(--sub)}
#bolsaInfo{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
#bolsaLlena{border:0;background:var(--warn);color:#fff;border-radius:8px;padding:10px 12px;font-weight:bold}
#scan{width:100%;font-size:20px;padding:14px;border:3px solid var(--pri);border-radius:10px;outline:none;font-family:monospace}
#scanRow{display:flex;gap:6px}
#kb,#camBtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:0 12px;font-size:20px}
#camBtn{background:var(--pri);border-color:var(--pri);color:#fff}
#cam{position:fixed;inset:0;background:#000;z-index:30;display:none;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#camGuia{position:absolute;left:8%;right:8%;top:32%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
#camGuia.ok{border-color:#34a853}#camGuia.warn{border-color:#fbbc04}#camGuia.err{border-color:#ea4335}
#camTop{position:absolute;top:0;left:0;right:0;padding:10px 12px;color:#fff;font-size:15px;background:linear-gradient(rgba(0,0,0,.7),transparent)}
#camLeido{font-family:monospace;font-size:18px;font-weight:bold;word-break:break-all;margin-top:4px}
#camAbajo{background:#111;padding:10px 12px;display:grid;gap:8px}
#camAbajo .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#camAbajo button{padding:14px 6px;font-size:15px;font-weight:bold;border:0;border-radius:8px}
#camUltimos .it{color:#fff;font-size:13px;padding:4px 8px;border-left:5px solid #666;margin-bottom:3px;background:#222;border-radius:4px;display:flex;justify-content:space-between;gap:6px}
#camUltimos .it.ok{border-left-color:#34a853}#camUltimos .it.warn{border-left-color:#fbbc04}#camUltimos .it.err{border-left-color:#ea4335}
#camFallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;padding:24px;text-align:center;gap:14px}
#actual{border-width:3px}
#actual.ok{border-color:var(--ok);background:var(--okbg)}
#actual.warn{border-color:var(--warn);background:var(--warnbg)}
#actual.err{border-color:var(--err);background:var(--errbg)}
.guia{font-family:monospace;font-size:18px;word-break:break-all;font-weight:bold}
.meta{font-size:14px;color:var(--sub);margin-top:4px}
.conf{display:flex;gap:6px;margin-top:8px}
.conf select{flex:1;font-size:16px;padding:10px;border-radius:8px;border:2px solid var(--warn);background:#fff}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;font-size:15px;color:#fff;background:var(--pri)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}.btn.gray{background:#6b7280}
#lista .it{display:flex;flex-direction:column;border-left:6px solid var(--line);padding:8px;margin-bottom:6px;background:#fff;border-radius:6px}
#lista .it.ok{border-left-color:var(--ok)}#lista .it.warn{border-left-color:var(--warn)}#lista .it.err{border-left-color:var(--err);background:var(--errbg)}
#lista .row{display:flex;justify-content:space-between;gap:6px;align-items:center}
#lista .acts{display:flex;gap:6px;margin-top:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px}
.dest{margin-top:8px;padding:10px;border-radius:8px;background:#1c1f24;color:#fff;font-size:18px;font-weight:bold;text-align:center}
.rackSel{display:flex;gap:6px;align-items:center;margin-top:8px}
.rackSel select{flex:1;font-size:16px;padding:10px;border-radius:8px;border:2px solid var(--pri);background:#fff}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:8px;font-weight:bold;color:var(--sub);font-size:15px}
.tabs button.on{border-bottom-color:var(--pri);color:var(--pri)}
#cola{position:fixed;bottom:0;left:0;right:0;background:#1c1f24;color:#fff;font-size:13px;padding:6px 12px;display:flex;justify-content:space-between}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:420px}
#modal h3{margin:0 0 10px}
#modal .opts{display:grid;gap:8px;margin:10px 0}
#modal .opts button{padding:14px;font-size:16px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:bold}
#modal textarea{width:100%;font-size:16px;padding:8px;border-radius:8px;border:2px solid var(--line)}
.hide{display:none!important}
</style>
</head>
<body>
<header><b>Retornos · Recepción</b><button id="op" onclick="elegirOperador()">Operador</button></header>
<main>
 <section class="card">
  <p class="lbl">Destinatario (según la etiqueta)</p>
  <div class="seg" id="dest"></div>
 </section>
 <section class="card" id="ubic">
  <p class="lbl">Ubicación BringGo</p>
  <div class="tipo" id="tipo">
   <button data-t="Rack" onclick="setTipo('Rack')">Rack</button>
   <button data-t="Bolsa" onclick="setTipo('Bolsa')">Bolsa (paquete chico)</button>
  </div>
  <p class="meta" id="ubicHint"></p>
  <div class="racks" id="racks"></div>
 </section>
 <section class="card">
  <p class="lbl">Escanear guía</p>
  <div id="scanRow"><input id="scan" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="none" placeholder="Escanee aquí"><button id="camBtn" onclick="abrirCamara()" title="Escanear con cámara">📷</button><button id="kb" onclick="toggleKb()" title="Teclado">⌨</button></div>
 </section>
 <section class="card hide" id="actual"></section>
 <div class="tabs"><button id="tabS" class="on" onclick="tab('S')">Esta sesión</button><button id="tabP" onclick="tab('P')">Por confirmar</button><button id="tabR" onclick="tab('R')">Sin rack</button></div>
 <section id="lista"></section>
 <section id="pend" class="hide"></section>
 <section id="sinRack" class="hide"></section>
</main>
<div id="cola"><span id="estadoCola">Listo</span><span id="conteo">0 escaneos</span></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="cam">
 <video id="camVideo" playsinline muted autoplay></video>
 <div id="camGuia"></div>
 <div id="camTop"><div id="camMsg">Apunta al código de barras de la guía</div><div id="camLeido"></div></div>
 <div id="camFallback">
  <p id="camFbTxt">Esta página de Google no permite la cámara en vivo.<br>Toma una foto del código de barras: cada foto registra una guía.</p>
  <button class="btn" id="camFbBtn" style="padding:18px 24px;font-size:18px" onclick="$('camFoto').click()">📸 Tomar foto de la guía</button>
  <button class="btn gray" id="camReintentar" onclick="reintentarVivo()">Reintentar cámara en vivo</button>
 </div>
 <div id="camAbajo">
  <div id="camUltimos"></div>
  <div class="acts">
   <button onclick="$('camFoto').click()" style="background:#3c4043;color:#fff">📸 Foto</button>
   <button id="camLuz" onclick="alternarLuz()" style="background:#3c4043;color:#fff">🔦 Luz</button>
   <button onclick="cerrarCamara()" style="background:#fff;color:#000">Cerrar</button>
  </div>
 </div>
 <input type="file" id="camFoto" accept="image/*" capture="environment" style="display:none" onchange="leerFoto(this)">
</div>
<script>
const S={operador:localGet('op')||'',destinatario:localGet('dest')||'BringGo',tipo:localGet('tipo')||'Rack',rack:localGet('rack')||'',
 cfg:null,resumen:{racks:{}},cola:[],procesando:false,items:[],actual:null,vistos:{},n:0,elegidas:{}};
function localGet(k){try{return localStorage.getItem('ret_'+k);}catch(e){return null;}}
function localSet(k,v){try{localStorage.setItem('ret_'+k,v);}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Para valores dentro de onclick="fn('…')": escapa \ y ' para JS y luego para HTML (ej. un operador "D'Angelo").
const escJs=s=>esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
// La misma pantalla funciona dentro de Apps Script (google.script.run) y como página propia
// (GitHub Pages), donde habla con la API doPost del script usando la URL /exec y el código de acceso.
const EN_APPS_SCRIPT=typeof google!=='undefined'&&google.script&&google.script.run;
const URL_VALIDA=/^https:\/\/script\.google\.com\/[^\s#?]+\/exec$/;
const API={url:localGet('api')||'',k:localGet('k')||''};
(function leerEnlace(){ // enlace de configuración: ...#api=<URL /exec>&k=<código>
 const h=new URLSearchParams(location.hash.slice(1));
 // Solo se acepta una URL /exec de script.google.com (evita que un enlace falso mande los datos a otro servidor).
 const api=(h.get('api')||'').replace(/\/macros\/u\/\d+\//,'/macros/');
 if(api&&URL_VALIDA.test(api)){API.url=api;localSet('api',API.url);}
 if(h.get('k')){API.k=h.get('k').toUpperCase();localSet('k',API.k);}
 if(h.get('api')||h.get('k'))history.replaceState(null,'',location.pathname+location.search);
})();
function run(fn,...args){
 if(EN_APPS_SCRIPT)return new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...args));
 if(!API.url||!API.k){configurar();return Promise.reject(new Error('Falta configurar la conexión'));}
 return fetch(API.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({k:API.k,fn,args})})
  .then(r=>{if(!r.ok)throw new Error('El servidor respondió '+r.status);return r.json();})
  .then(j=>{if(!j.ok){if(j.acceso===false)configurar('El código de acceso no es correcto.');throw new Error(j.error||'Error del servidor');}return j.r;});
}
function configurar(aviso){
 modal(`<h3>Conectar con la hoja</h3>${aviso?`<p style="color:var(--err)">${esc(aviso)}</p>`:''}
  <p class="meta">Pide al responsable el enlace de configuración, o escribe los datos:</p>
  <p class="lbl">URL de la app (termina en /exec)</p><input id="cfgUrl" style="width:100%;font-size:15px;padding:10px;border:2px solid var(--line);border-radius:8px" value="${esc(API.url)}">
  <p class="lbl" style="margin-top:10px">Código de acceso</p><input id="cfgK" style="width:100%;font-size:18px;padding:10px;border:2px solid var(--line);border-radius:8px;text-transform:uppercase" value="${esc(API.k)}">
  <div class="opts"><button onclick="guardarConfig()">Guardar y conectar</button></div>`,true);
}
function guardarConfig(){
 // Quita el número de cuenta (/u/1/) que Google agrega cuando hay varias cuentas abiertas.
 API.url=$('cfgUrl').value.trim().replace(/\/macros\/u\/\d+\//,'/macros/');API.k=$('cfgK').value.trim().toUpperCase();
 if(!URL_VALIDA.test(API.url)){toast('La URL debe ser de script.google.com y terminar en /exec','err');return;}
 if(!API.k){toast('Escribe el código de acceso','err');return;}
 localSet('api',API.url);localSet('k',API.k);cerrarModal();iniciar();
}

// ---- Sonido y vibración ----
let actx=null;
function tono(f,ms,veces){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 for(let i=0;i<(veces||1);i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+i*(ms+80)/1000;g.gain.setValueAtTime(.25,t);o.start(t);o.stop(t+ms/1000);}}catch(e){}}
function aviso(tipo){if(tipo==='ok')tono(1200,90);else if(tipo==='warn')tono(800,120,2);else{tono(300,450);}
 if(navigator.vibrate)navigator.vibrate(tipo==='ok'?60:tipo==='warn'?[80,60,80]:[350,100,350]);}

// ---- Inicio ----
function iniciar(){$('estadoCola').textContent='Conectando…';
 run('appInicio').then(cfg=>{S.cfg=cfg;S.resumen=cfg.resumen;$('estadoCola').textContent='Listo';pintarContexto();if(!S.operador)elegirOperador();foco();})
 .catch(e=>{$('estadoCola').textContent='Sin conexión: '+e.message;
  // En la página propia, un error de conexión casi siempre es la URL o el código: se muestran para corregirlos.
  if(!EN_APPS_SCRIPT&&!modalAbierto)configurar(mensajeConexion(e));});}
function mensajeConexion(e){const m=String(e&&e.message||e);
 if(/40[45]/.test(m))return 'No se pudo conectar ('+m+'). Revisa que la URL sea la de la aplicación web del proyecto "Escaneo Retornos — Eyoyo" (Implementar → Administrar implementaciones) y que termine en /exec.';
 if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'No se pudo conectar. Revisa la URL, que la app esté publicada con acceso "Cualquier persona" y que el teléfono tenga internet.';
 return 'No se pudo conectar: '+m;}

function pintarContexto(){
 const c=S.cfg;if(!c)return;
 $('op').textContent=S.operador||'Elegir operador';
 $('dest').innerHTML=c.destinatarios.map(d=>`<button class="${d===S.destinatario?'on':''} ${S.actual&&S.actual.sugerenciaDestino===d&&d!==S.destinatario?'sug':''}" onclick="setDest('${escJs(d)}')">${esc(d)}</button>`).join('');
 const esB=S.destinatario==='BringGo';$('ubic').classList.toggle('hide',!esB);
 document.querySelectorAll('#tipo button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tipo));
 $('racks').innerHTML=c.racks.map(r=>{const x=S.resumen.racks[r]||{},n=r.replace(/\D/g,'');
  const det=S.tipo==='Bolsa'?(x.bolsaAbierta?x.bolsaAbierta.replace('Bolsa ','B')+' · '+(x.enBolsaAbierta||0):'sin bolsa'):(x.rack||0)+' este mes';
  return `<button class="${S.tipo!=='Bolsa'&&r===S.rack?'on':''}" onclick="setRack('${escJs(r)}')">R${n}<small>${esc(det)}</small></button>`;}).join('');
 $('ubicHint').textContent=S.tipo==='Bolsa'
  ?'La app elige la bolsa según la paquetería. Toca un rack para marcar su bolsa como llena.'
  :'Paquete grande: elige el rack (o déjalo vacío y asígnalo después).';
}
function elegirOperador(){
 if(!S.cfg){if(!EN_APPS_SCRIPT)configurar('Primero conecta el teléfono con la hoja.');else toast('Sin conexión con la hoja','err');return;}
 const ops=S.cfg.operadores||[];
 modal(`<h3>¿Quién escanea?</h3><div class="opts">${ops.map(o=>`<button onclick="setOp('${escJs(o)}')">${esc(o)}</button>`).join('')}</div>
  <p class="meta">Para agregar operadores, edita la columna Operador en la pestaña Catálogos.</p>`);
}
function setOp(o){S.operador=o;localSet('op',o);cerrarModal();pintarContexto();foco();}

// Tocar destinatario o ubicación cambia el contexto de los siguientes escaneos.
// Solo corrige el último paquete si se toca dentro de VENTANA_MS después de escanearlo
// (o después de tocar "Corregir ubicación" en su tarjeta).
const VENTANA_MS=20000;
function enVentana(a){return !!(a&&a.tipo==='registrado'&&a.ts&&Date.now()-a.ts<=VENTANA_MS);}
function setDest(d){S.destinatario=d;localSet('dest',d);
 // En modo Bolsa no se manda rack: el servidor lo elige por paquetería. En modo Rack se manda el rack elegido.
 const c={destinatario:d,tipo:S.tipo};if(d!=='BringGo')c.rack='';else if(S.tipo==='Rack')c.rack=S.rack;
 aplicarAlActual(c);pintarContexto();foco();}
function setTipo(t){S.tipo=t;localSet('tipo',t);
 if(S.destinatario==='BringGo')aplicarAlActual(t==='Bolsa'?{tipo:'Bolsa',destinatario:'BringGo'}:{tipo:'Rack',rack:S.rack,destinatario:'BringGo'});
 pintarContexto();foco();}
// En modo Bolsa el rack lo decide la app: tocar un rack sirve para marcar su bolsa como llena.
function setRack(r){if(S.tipo==='Bolsa'){bolsaLlena(r);return;}
 S.rack=r;localSet('rack',r);aplicarAlActual({rack:r,tipo:'Rack',destinatario:'BringGo'});pintarContexto();foco();}
function ctxActual(){return {operador:S.operador,destinatario:S.destinatario,tipo:S.tipo,rack:S.destinatario==='BringGo'&&S.tipo==='Rack'?S.rack:''};}

function aplicarAlActual(c){
 const a=S.actual;if(!a||a.tipo!=='registrado')return;
 if(!enVentana(a)){toast('Cambio aplicado a los siguientes paquetes','ok');return;}
 a.ts=Date.now(); // cada corrección reinicia la ventana
 run('appActualizar',a.id,c,S.operador).then(r=>{if(r.ok){Object.assign(a,r);pintarActual();pintarLista();refrescarResumen();}else toast(r.error,'err');})
  .catch(e=>toast('No se guardó el cambio: '+e.message,'err'));
}

// ---- Escaneo: la entrada nunca se bloquea; las lecturas se procesan en cola ----
$('scan').addEventListener('keydown',ev=>{
 if(ev.key==='Enter'||ev.key==='Tab'){ev.preventDefault();const v=$('scan').value;$('scan').value='';if(v.trim())encolar(v);}
});
function encolar(raw){
 if(!S.operador){elegirOperador();toast('Elige operador antes de escanear','warn');return;}
 const clave=claveLocal(raw);
 if(S.vistos[clave]){ // duplicado dentro de la misma sesión: se marca al instante
  const orig=S.vistos[clave];
  const dup={tipo:'duplicado',guia:raw.trim().toUpperCase(),lectura:raw,clave,original:{id:orig.id||'',fila:orig.fila||'',fecha:orig.fecha||'',paqueteria:orig.paqueteria||''},local:true};
  agregarItem(dup);aviso('err');return;
 }
 S.vistos[clave]={pendiente:true};
 S.cola.push({raw,ctx:ctxActual()});
 procesarCola();
}
function claveLocal(raw){let g=String(raw).replace(/^\]C1/i,'').replace(/[\s\x1d]/g,'').toUpperCase();
 if(/^JJD/.test(g))return g.slice(1);
 if(/^(?:\d{20}00\d{12}|96\d{32})$/.test(g)){const t=g.slice(20);return t.startsWith('00')?t.slice(2):t;}
 return g;}
async function procesarCola(){
 if(S.procesando)return;S.procesando=true;
 while(S.cola.length){
  $('estadoCola').textContent='Registrando… ('+S.cola.length+' en cola)';
  const job=S.cola.shift();
  try{
   const r=await run('appEscanear',job.raw,job.ctx);
   const clave=claveLocal(job.raw);
   if(r.tipo==='registrado'){r.ts=Date.now();S.vistos[clave]=r;S.actual=r;S.n++;agregarItem(r);aviso(r.estado==='Confirmado'?'ok':'warn');pintarActual();
    if(r.sugerenciaDestino&&r.sugerenciaDestino!==r.destinatario)toast('La referencia indica '+r.sugerenciaDestino+'. Toca el botón marcado si aplica.','warn');}
   else if(r.tipo==='duplicado'){S.vistos[clave]=r.original;agregarItem(r);aviso('err');}
  }catch(e){delete S.vistos[claveLocal(job.raw)];
   agregarItem({tipo:'error',guia:job.raw,mensaje:e.message,job});aviso('err');}
 }
 S.procesando=false;$('estadoCola').textContent='Listo';$('conteo').textContent=S.n+' registrados';refrescarResumen();
}
function refrescarResumen(){run('appResumen').then(r=>{S.resumen=r;pintarContexto();}).catch(()=>{});}

// ---- Paquete actual (paso 5) ----
function clase(it){return it.tipo==='duplicado'||it.tipo==='error'?'err':it.estado==='Confirmado'?'ok':'warn';}
function ubicTxt(it){if(it.destinatario!=='BringGo')return it.destinatario||'Sin destinatario';
 if(!it.rack)return 'BringGo · sin rack';return 'BringGo · '+it.rack+(it.ubicacion==='Bolsa'?' · '+it.bolsa:'');}
// S.elegidas[id] guarda lo que el operador eligió en el menú; tiene prioridad sobre la sugerencia.

// ---- Escaneo con cámara ----
// 1) Cámara en vivo (getUserMedia) con lector nativo BarcodeDetector o, si no existe, ZXing.
// 2) Si el navegador no permite la cámara en vivo, foto con la cámara del teléfono y se lee el código de la foto.
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const FORMATOS_1D=['code_128','code_39','code_93','itf','codabar','ean_13','ean_8','upc_a','upc_e'];
const FORMATOS=FORMATOS_1D.concat(['qr_code','data_matrix','pdf417']);
let camAbierta=false,camStream=null,camTimer=null,camUltimo={v:'',t:0},detector=null,zx=null,luz=false;
function cargarZXing(){
 if(window.ZXing)return Promise.resolve(window.ZXing);
 return new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src=ZXING_URL;sc.onload=()=>ok(window.ZXing);sc.onerror=()=>ko(new Error('No se pudo cargar el lector de códigos'));document.head.appendChild(sc);});
}
async function prepararLector(){
 if(detector||zx)return;
 if('BarcodeDetector' in window){
  try{const disp=await BarcodeDetector.getSupportedFormats();const f=FORMATOS.filter(x=>disp.includes(x));
   if(f.some(x=>FORMATOS_1D.includes(x))){detector=new BarcodeDetector({formats:f});return;}}catch(e){}
 }
 const Z=await cargarZXing(),h=new Map();
 h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.CODABAR,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.DATA_MATRIX]);
 h.set(Z.DecodeHintType.TRY_HARDER,true);
 const r=new Z.MultiFormatReader();r.setHints(h);zx={Z,r};
}
// Valida que la lectura parezca una guía: descarta los PDF417/QR largos de FedEx y similares.
function guiaValida(t){const g=String(t||'').replace(/^\]C1/i,'').replace(/[\s\x1d]/g,'');return /^[A-Za-z0-9][A-Za-z0-9-]{4,38}[A-Za-z0-9]$/.test(g)?g:'';} // sin guion al inicio ni al final
function elegirLectura(lecturas){ // lecturas: [{texto, formato}]; prefiere códigos de barras lineales
 const val=lecturas.map(l=>({g:guiaValida(l.texto),lineal:FORMATOS_1D.includes(l.formato)})).filter(l=>l.g);
 val.sort((a,b)=>(b.lineal-a.lineal)||(b.g.length-a.g.length));
 return val.length?val[0].g:'';
}
// ZXing lee un solo código por intento. Las etiquetas traen también códigos 2D (PDF417/QR) que no son la guía,
// así que se prueba la imagen completa y luego franjas horizontales hasta encontrar una guía válida.
function zxLeer(fuente,sx,sy,sw,sh,max){
 const {Z,r}=zx,k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
 const ctx=c.getContext('2d');ctx.drawImage(fuente,sx,sy,sw,sh,0,0,c.width,c.height);
 const intento=()=>{try{const res=r.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));
   return elegirLectura([{texto:res.getText(),formato:String(Z.BarcodeFormat[res.getBarcodeFormat()]||'').toLowerCase()}]);}
  catch(e){return '';}finally{r.reset();}};
 let g=intento();if(g)return g;
 // Segundo intento con la imagen aclarada: un fondo gris oscuro junto a la etiqueta impide que ZXing
 // encuentre el inicio del código; al aclarar, el fondo queda blanco y las barras siguen negras.
 const d=ctx.getImageData(0,0,c.width,c.height),px=d.data;
 for(let i=0;i<px.length;i+=4){px[i]=Math.min(255,px[i]*2.2);px[i+1]=Math.min(255,px[i+1]*2.2);px[i+2]=Math.min(255,px[i+2]*2.2);}
 ctx.putImageData(d,0,0);return intento();
}
async function detectar(fuente,ancho,alto,foto){
 if(detector){const r=await detector.detect(fuente);return elegirLectura(r.map(x=>({texto:x.rawValue,formato:x.format})));}
 const max=foto?2000:1280;
 if(!foto){ // video: primero la franja central (donde está el recuadro guía), luego el cuadro completo
  return zxLeer(fuente,ancho*0.1,alto*0.3,ancho*0.8,alto*0.4,max)||zxLeer(fuente,0,alto*0.3,ancho,alto*0.4,max)||zxLeer(fuente,0,0,ancho,alto,max);
 }
 let g=zxLeer(fuente,0,0,ancho,alto,max);if(g)return g;
 // Recortes con traslape: 5 franjas de 1/3 de alto × 3 ventanas de 60% de ancho.
 // Los recortes evitan que el fondo o los bordes de la etiqueta confundan al lector.
 const alt=alto/3,anc=ancho*0.6;
 for(let i=0;i<5&&!g;i++)for(let j=0;j<3&&!g;j++)g=zxLeer(fuente,j*(ancho-anc)/2,i*(alto-alt)/4,anc,alt,max);
 return g;
}
function marcarCam(clase,texto){const g=$('camGuia');g.className=clase||'';if(texto!==undefined)$('camLeido').textContent=texto;if(clase)setTimeout(()=>{g.className='';},700);}
// Cámara en vivo: una lectura solo cuenta si el mismo texto se lee 2 veces seguidas (en menos de 1.5 s).
// Así se descartan lecturas con un carácter equivocado, que salen una sola vez.
let camCand={v:'',n:0,t:0};
function lecturaVideo(g){
 const ahora=Date.now();
 if(g===camCand.v&&ahora-camCand.t<1500)camCand.n++;else camCand={v:g,n:1,t:ahora};
 camCand.t=ahora;
 if(camCand.n>=2)recibirLectura(g);
}
function recibirLectura(g){
 // Misma etiqueta que sigue frente a la cámara: se ignora y se renueva el tiempo, para que no salga como duplicado.
 // Si la cámara deja de verla más de 3 s y vuelve, sí se manda (y el servidor la marca si ya existe).
 const ahora=Date.now();if(g===camUltimo.v&&ahora-camUltimo.t<3000){camUltimo.t=ahora;return;}
 camUltimo={v:g,t:ahora};marcarCam('ok',g);encolar(g);
}
// Apps Script muestra la app dentro de un marco sin permiso de cámara: getUserMedia falla sin preguntar.
// Se revisa la política del marco antes de intentarlo y, si no la permite, se abre directo la cámara de fotos
// (el clic del botón todavía cuenta como acción del usuario, que el navegador exige para abrirla).
function politicaPermiteCamara(){try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)return pp.allowsFeature('camera');}catch(e){}return null;}
function camaraEnVivoPermitida(){
 const pol=politicaPermiteCamara();if(pol!==null)return pol;
 try{if(localGet('sinVivo')==='1')return false;}catch(e){}
 return true;
}
async function abrirCamara(){
 if(!camaraEnVivoPermitida()){
  camAbierta=true;$('cam').style.display='flex';$('camLuz').style.display='none';$('scan').blur();
  mostrarFallback();$('camFoto').click();prepararLector().catch(e=>{$('camMsg').textContent=e.message;});return;
 }
 camAbierta=true;$('cam').style.display='flex';$('camFallback').style.display='none';$('camLuz').style.display='none';
 $('camMsg').textContent='Preparando cámara…';marcarCam('','');pintarCamUltimos();$('scan').blur();
 try{await prepararLector();}catch(e){$('camMsg').textContent=e.message;return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){mostrarFallback();return;}
 try{
  camStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
 }catch(e){mostrarFallback(e);return;}
 const v=$('camVideo');v.srcObject=camStream;try{await v.play();}catch(e){}
 const pista=camStream.getVideoTracks()[0],cap=pista&&pista.getCapabilities?pista.getCapabilities():{};
 if(cap.torch)$('camLuz').style.display='';
 $('camMsg').textContent='Apunta al código de barras de la guía';
 let ocupado=false;
 camTimer=setInterval(async()=>{
  if(ocupado||!camAbierta||v.readyState<2)return;ocupado=true;
  try{const g=await detectar(v,v.videoWidth,v.videoHeight);if(g)lecturaVideo(g);}catch(e){}finally{ocupado=false;}
 },detector?200:450);
}
function mostrarFallback(err){
 // Solo si el navegador negó el permiso se recuerda ir directo a la foto (una cámara ocupada es temporal).
 if(err&&(err.name==='NotAllowedError'||err.name==='SecurityError'))localSet('sinVivo','1');
 $('camMsg').textContent='';$('camFbBtn').textContent='📸 Tomar foto de la guía';
 $('camReintentar').style.display=politicaPermiteCamara()===false?'none':''; // dentro de Apps Script nunca hay cámara en vivo
 $('camFallback').style.display='flex';
}
async function leerFoto(input){
 const f=input.files&&input.files[0];input.value='';if(!f)return;
 $('camMsg').textContent='Leyendo foto…';
 try{
  await prepararLector();
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('No se pudo abrir la foto'));i.src=URL.createObjectURL(f);});
  const g=await detectar(img,img.naturalWidth,img.naturalHeight,true);URL.revokeObjectURL(img.src);
  if(g){camUltimo={v:'',t:0};recibirLectura(g);$('camMsg').textContent='Foto leída.';$('camFbBtn').textContent='📸 Siguiente guía';}
  else{marcarCam('err','');aviso('warn');$('camMsg').textContent='No se encontró el código. Acerca la cámara al código de barras, con buena luz.';}
 }catch(e){$('camMsg').textContent=e.message;}
}
async function alternarLuz(){
 const p=camStream&&camStream.getVideoTracks()[0];if(!p)return;luz=!luz;
 try{await p.applyConstraints({advanced:[{torch:luz}]});}catch(e){luz=false;}
}
function reintentarVivo(){localSet('sinVivo','');cerrarCamara();abrirCamara();}
function cerrarCamara(){
 camAbierta=false;clearInterval(camTimer);camTimer=null;camCand={v:'',n:0,t:0};
 if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
 $('camVideo').srcObject=null;$('cam').style.display='none';luz=false;foco();
}
// Muestra los 3 últimos resultados (verde, amarillo, rojo) mientras la cámara está abierta.
function pintarCamUltimos(){
 const el=$('camUltimos');if(!el||!camAbierta)return;
 el.innerHTML=S.items.slice(0,3).map(it=>`<div class="it ${clase(it)}"><span>${esc(it.guia)}</span><span>${it.tipo==='duplicado'?'DUPLICADO':it.tipo==='error'?'SIN GUARDAR':esc(it.paqueteria)}</span></div>`).join('');
 const u=S.items[0];if(u&&String(u.guia).toUpperCase()===String(camUltimo.v).toUpperCase())marcarCam(clase(u));
}

// ---- Utilidades de pantalla ----
let kb=false;function toggleKb(){kb=!kb;$('scan').setAttribute('inputmode',kb?'text':'none');$('scan').blur();setTimeout(foco,50);}
let modalAbierto=false;
function modal(html,bloquea){$('mbox').innerHTML=html;$('modal').style.display='flex';modalAbierto=true;}
function cerrarModal(){$('modal').style.display='none';modalAbierto=false;}
let toastTimer=null;
function toast(m,t){$('estadoCola').textContent=m;if(camAbierta)$('camMsg').textContent=m;if(t!=='ok')aviso(t==='err'?'err':'warn');
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(!S.procesando)$('estadoCola').textContent='Listo';},4000);}
function foco(){if(!camAbierta&&!modalAbierto&&document.activeElement&&document.activeElement.tagName!=='SELECT')$('scan').focus();}
// El lector escribe como teclado: muchos caracteres seguidos (menos de LECTOR_MS entre teclas) y Enter.
// Si el foco no está en el campo de escaneo (menú abierto, diálogo, nota), esas teclas se capturan aquí
// para que la lectura no se pierda ni se escriba dentro del menú o de la nota.
const LECTOR_MS=60;let lb={txt:'',ultimo:0,rapidas:0,el:null,valorInicial:null};
document.addEventListener('keydown',ev=>{
 if(ev.target===$('scan'))return;
 const ahora=Date.now(),t=ev.target,editable=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
 if(ev.key.length===1&&!ev.ctrlKey&&!ev.altKey&&!ev.metaKey){
  // Una pausa mayor a LECTOR_MS entre teclas es escritura humana: empieza un búfer nuevo.
  if(ahora-lb.ultimo>LECTOR_MS){lb={txt:'',ultimo:0,rapidas:0,el:t,valorInicial:editable?t.value:null};}
  else lb.rapidas++;
  lb.txt+=ev.key;lb.ultimo=ahora;
  // En un menú nunca se escribe (evita que la primera letra cambie la paquetería elegida).
  if(t&&t.tagName==='SELECT')ev.preventDefault();
  else if(lb.rapidas>=3)ev.preventDefault(); // a partir del 4.º carácter rápido ya es el lector
  return;
 }
 if(ev.key==='Enter'||ev.key==='Tab'){
  const esLector=lb.txt.length>=6&&ahora-lb.ultimo<=LECTOR_MS*3&&lb.rapidas>=lb.txt.length-2;
  if(!esLector)return;
  ev.preventDefault();ev.stopPropagation();
  if(lb.el&&lb.valorInicial!==null&&'value' in lb.el)lb.el.value=lb.valorInicial; // quitar lo que alcanzó a escribirse
  const v=lb.txt;lb={txt:'',ultimo:0,rapidas:0,el:null,valorInicial:null};
  if(t&&t.tagName==='SELECT')t.blur();
  encolar(v);
 }
},true);
// Mantener el foco en el campo de escaneo salvo cuando se usa un menú o un diálogo.
document.addEventListener('click',ev=>{if(!['SELECT','OPTION','TEXTAREA'].includes(ev.target.tagName))setTimeout(foco,0);});
// Al elegir en un menú se suelta el foco: así la lista se puede redibujar y el campo de escaneo vuelve a recibir lecturas.
document.addEventListener('change',ev=>{if(ev.target&&ev.target.tagName==='SELECT')ev.target.blur();setTimeout(foco,0);});
setInterval(()=>{if(document.activeElement===document.body)foco();},1500);
iniciar();
</script>
